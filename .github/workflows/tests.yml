name: Laravel bridge

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            illuminate: '^11.0'
          - php: '8.2'
            illuminate: '^12.0'
          - php: '8.3'
            illuminate: '^13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom
          tools: composer:v2
          coverage: none
      - run: composer require --no-update "illuminate/contracts:${{ matrix.illuminate }}"
      - run: composer require --no-update --dev "illuminate/validation:${{ matrix.illuminate }}" "illuminate/translation:${{ matrix.illuminate }}"
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: composer test
